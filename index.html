  function finance(a){if(a==='transfer'&&S.cash>=8){S.cash-=8;S.transfer+=10;S.board=cap(S.board-1);news('예산 전환','운영 자금 8억을 이적 예산 10억으로 전환했습니다.','finance')}if(a==='infra'&&S.cash>=7){S.cash-=7;S.infrastructure+=9;S.fans=cap(S.fans+1);news('예산 전환','운영 자금 7억을 인프라 예산 9억으로 전환했습니다.','finance')}if(a==='family'){S.ticket='family';S.monthly=Math.max(1,S.monthly-1);S.fans=cap(S.fans+4);news('티켓 정책 변경','지역·가족 우대 티켓을 도입했습니다.','finance')}if(a==='premium'){S.ticket='premium';S.monthly+=2;S.fans=cap(S.fans-3);news('티켓 정책 변경','프리미엄 가격 정책을 적용했습니다.','finance')}if(a==='sponsor'&&S.sponsor==='none'){S.sponsor='regional';S.cash+=13;S.monthly+=2;S.fans=cap(S.fans+2);news('스폰서 계약 체결','지역 조항을 포함한 메인 스폰서 계약을 체결했습니다.','gold')}save();render()}
  function clubAction(a){if(a==='fans'&&S.cash>=3){S.cash-=3;S.fanPlan='open';news('지역 공개 훈련 승인','이번 주 공개 훈련과 유소년 초청 행사를 운영합니다. 다음 일정에서 팬 반응이 도착합니다.','fans')}if(a==='ambition'){S.mediaTone='ambition';news('시즌 목표 언론 선언','승격 경쟁을 공개 선언했습니다. 다음 주 전국 매체와 이사회가 반응합니다.','media')}if(a==='calm'){S.mediaTone='calm';news('감독·주장 공동 브리핑','성적보다 안정적인 운영을 강조하는 공동 브리핑을 준비합니다.','media')}if(a==='youth'){S.boardMandate='youth';S.board=cap(S.board+2);S.fans=cap(S.fans+2);news('이사회 전략 전환','유스·지역 정체성을 3년 핵심 목표로 설정했습니다. 단기 순위 기준이 완화됩니다.','board')}if(a==='promotion'){S.boardMandate='promotion';S.transfer+=6;S.board=cap(S.board-2);news('승격 가속안 승인','이사회가 단기 성적을 위해 이적 예산 6억을 추가했습니다. 성과 기준은 높아집니다.','board')}save();render()}
  function projectStart(){const p=project();if(p.state!=='proposal')return;if(S.infrastructure<p.cost){news('인프라 예산 부족',`${p.name} 착수에는 ${p.cost}억이 필요합니다.`,'bad')}else{S.infrastructure-=p.cost;p.state='construction';news('프로젝트 착수',`${p.name} 공사가 시작됐습니다. ${p.weeks}주 동안 매주 ${p.weekly}억이 지출됩니다.`,'gold')}save();render()}
  function staffAction(a){const s=staffer();if(a==='seminar'&&S.cash>=6){S.cash-=6;s.rating=cap(s.rating+3);s.relation=cap(s.relation+4);news('스태프 교육',`${s.name}을 전문 세미나에 파견했습니다. 부서 평가가 상승했습니다.`,'staff')}if(a==='delegate'){const k=s.department==='스카우트 조직'?'scout':s.department==='기술 조직'?'youth':s.department==='경영 조직'?'commercial':'finance';S.delegations[k]=!S.delegations[k];news('업무 위임 정책 변경',`${s.department}의 자동 보고가 ${S.delegations[k]?'활성화':'수동 전환'}됐습니다.`,'staff')}save();render()}
  function appointManager(){const current=S.staff.find(x=>x.role==='감독'),candidate=S.managerCandidate;if(current){current.name=candidate.name;current.rating=candidate.rating;current.relation=72;current.contractWeeks=156;current.status='신임'}S.manager=cap(Math.max(S.manager,candidate.rating));S.board=cap(S.board+3);S.unity=cap(S.unity+2);S.cinematic='manager';news('감독 선임 완료',`${candidate.name} 감독이 ${getClub(S.clubId).name}과 3년 계약에 서명했습니다. 새 감독의 평가 ${candidate.rating}가 시즌 운영에 반영됩니다.`,'gold');save();render()}
  function talk(who){if(who==='manager')S.manager=cap(S.manager+2);if(who==='captain')S.unity=cap(S.unity+2);news('관계 면담',`${who==='manager'?'감독':'주장'}과 구단 운영 현안을 논의했습니다.`,'info');save();render()}

  const cinemaMeta={acquisition:{eyebrow:'ACQUISITION CEREMONY',title:'경영권 인수 완료',copy:'새로운 구단주의 첫 서명이 클럽 다이너스티의 시작이 됩니다.',poster:'assets/acquisition_poster.jpg',video:'assets/acquisition_cinematic.mp4'},player:{eyebrow:'PLAYER SIGNING',title:'새로운 선수가 합류했습니다',copy:'계약과 유니폼, 그리고 다음 시즌의 가능성이 지금 구단에 더해집니다.',poster:'assets/player_signing_poster.jpg',video:'assets/player_signing_cinematic.mp4'},manager:{eyebrow:'MANAGER APPOINTMENT',title:'새 감독이 취임했습니다',copy:'구단주와 감독의 새로운 약속이 라커룸과 시즌 운영을 이끌게 됩니다.',poster:'assets/manager_appointment_poster.jpg',video:'assets/manager_appointment_cinematic.mp4'}};
  function cinemaModal(){const m=cinemaMeta[S.cinematic];if(!m)return'';return`<section class="cinema-modal" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><div class="cinema-frame"><div class="cinema-media"><video id="cinematicVideo" controls playsinline preload="metadata" poster="${m.poster}"><source src="${m.video}" type="video/mp4"></video></div><div class="cinema-copy"><div><div class="eyebrow">${m.eyebrow}</div><h2>${m.title}</h2><p>${m.copy} 영상 재생이 어려운 환경에서도 이 결과는 이미 저장됐습니다.</p></div><div class="cinema-controls"><button class="btn light" data-a="cinema-play">영상 재생</button><button class="btn gold" data-a="cinema-close">계속 운영하기</button></div></div></div></section>`}
  function shell(content){const c=getClub(S.clubId),nav=[['profile','◉','프로필'],['life','✦','라이프'],['people','♥','인물'],['home','⌂','뉴스'],['campus','▣','캠퍼스'],['squad','◎','선수단'],['transfers','⇄','이적'],['staff','♙','스태프'],['finance','₩','재정'],['facilities','⌘','시설'],['calendar','▦','일정']];return `<div class="game"><aside class="sidebar"><div class="brand"><div class="eyebrow">club dynasty / 2026</div><h1>클럽<br>다이너스티 2026</h1><button class="owner-mini" data-a="view" data-v="profile">${ownerPortrait()}<span><b>${esc(ownerName())}</b>${esc(c.name)} · ${S.profile.age}세</span></button></div><nav class="nav">${nav.map(n=>`<button class="${S.view===n[0]?'active':''}" data-a="view" data-v="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav><div class="side-bottom"><small>시즌 목표</small><strong>${esc(c.challenge)}</strong><small>다음 주요 일정</small><strong>${S.week}주차 감독 AI 경기</strong></div></aside><main class="main"><header class="top"><div class="top-title">${leagueName(S.league)} · ${esc(c.city)}<b>${title(S.view)}</b></div><div class="top-actions"><div class="date"><b>${S.season} 시즌 · ${S.week}주차</b>월요일 / 운영 주간</div><button class="advance" data-a="next">다음 주요 일정 ›</button></div></header><div class="content">${content}</div><nav class="mobile-nav">${nav.map(n=>`<button class="${S.view===n[0]?'active':''}" data-a="view" data-v="${n[0]}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav></main></div>${cinemaModal()}`}
  function ownerFields(paper=false){const p=S.profile,cls=paper?'input paper':'input';return`<div class="profile-form-grid"><div><label class="label">구단주 이름</label><input id="owner" data-profile="name" class="${cls}" value="${esc(p.name)}" placeholder="예: 김도윤"></div><div><label class="label">성별</label><select data-profile="gender" class="${cls}"><option ${p.gender==='선택 안 함'?'selected':''}>선택 안 함</option><option ${p.gender==='남성'?'selected':''}>남성</option><option ${p.gender==='여성'?'selected':''}>여성</option><option ${p.gender==='논바이너리'?'selected':''}>논바이너리</option></select></div><div><label class="label">나이</label><input id="ownerAge" data-profile="age" class="${cls}" type="number" min="25" max="75" value="${esc(p.age)}"></div><div><label class="label">키</label><input id="ownerHeight" data-profile="height" class="${cls}" type="number" min="150" max="210" value="${esc(p.height)}" placeholder="cm"></div><div><label class="label">경력</label><input id="ownerCareer" data-profile="career" class="${cls}" value="${esc(p.career)}" placeholder="예: 지역 기업가"></div></div><label class="label">구단주 프로필 사진</label><div class="photo-upload">${ownerPortrait()}<div><b>사진 업로드 또는 기본 가상 아바타</b><small>사진은 현재 브라우저의 로컬 저장소에만 저장됩니다. 실제 인물의 사용 권한은 사용자가 확인해야 합니다.</small><input id="profilePhoto" class="photo-input" type="file" accept="image/*"></div></div>`}
  function setupBudgetPanel(){const total=startupFund(),b=S.startBudget||{operating:0,transfer:0,infrastructure:0},sum=startBudgetSum(),diff=total-sum;if(!total)return`<section class="panel" style="margin:18px 0"><div class="eyebrow">STARTING CAPITAL</div><h3>출범 자금 배분실</h3><p>인수 방식과 대상 구단을 먼저 고르면 구단주가 운영·이적·인프라 예산을 직접 나눌 수 있습니다.</p></section>`;return`<section class="panel" style="margin:18px 0"><div class="head" style="margin-top:0"><div><div class="eyebrow">STARTING CAPITAL / OWNER DECISION</div><h3>출범 자금 배분실 · ${total}억</h3></div><small>합계 ${sum}억 / ${diff===0?'배분 완료':diff>0?`${diff}억 미배분`:`${Math.abs(diff)}억 초과`}</small></div><p>운영자금은 급여·재활·시설 공사비를 지키는 안전망입니다. 운영자금을 크게 잡으면 안정적이지만, 이적·인프라에 쓸 초기 재원은 줄어듭니다.</p><div class="actions"><button class="btn ${S.budgetPreset==='safe'?'gold':'light'}" data-a="budgetpreset" data-v="safe">안전 운영</button><button class="btn ${S.budgetPreset==='balanced'?'gold':'light'}" data-a="budgetpreset" data-v="balanced">균형 경영</button><button class="btn ${S.budgetPreset==='push'?'gold':'light'}" data-a="budgetpreset" data-v="push">승격 도전</button></div><div class="info" style="margin-top:14px"><label>운영자금<input class="input paper" type="number" min="20" max="${total}" data-budget="operating" value="${b.operating}"></label><label>이적예산<input class="input paper" type="number" min="0" max="${total}" data-budget="transfer" value="${b.transfer}"></label><label>인프라 예산<input class="input paper" type="number" min="0" max="${total}" data-budget="infrastructure" value="${b.infrastructure}"></label><div>배분 상태<b>${diff===0&&b.operating>=20?'준비 완료':'조정 필요'}</b></div></div>${S.setupError?`<p style="margin-top:12px;padding:10px 12px;background:#5a1f1d;color:#fff4df;font-weight:800">${esc(S.setupError)}</p>`:''}</section>`}
  function mountSetupBudget(){if(S.stage!=='setup')return;const panel=document.querySelector('.setup-panel'),marketLabel=[...panel.querySelectorAll('.label')].find(x=>x.textContent.trim()==='30개 구단 인수 시장');if(marketLabel&&!panel.querySelector('.budget-mounted')){const wrap=document.createElement('div');wrap.className='budget-mounted';wrap.innerHTML=setupBudgetPanel();marketLabel.before(wrap)}}
  function budgetMove(kind,amount){const n=Math.max(1,Math.min(50,Math.floor(Number(amount)||0)));if(!n){news('전환 금액 확인','1억 이상 50억 이하의 정수 금액을 입력해 주세요.','bad');save();render();return}let src,dst,label,impact='';if(kind==='cash-transfer'){src='cash';dst='transfer';label='운영자금 → 이적예산';impact=n>=15?' 이사회는 단기 성과 압박을 높였습니다.':'';if(n>=15)S.board=cap(S.board-1)}else if(kind==='cash-infrastructure'){src='cash';dst='infrastructure';label='운영자금 → 인프라 예산';S.fans=cap(S.fans+1)}else if(kind==='transfer-cash'){src='transfer';dst='cash';label='이적예산 → 운영자금'}else return;if((Number(S[src])||0)<n){news('예산 전환 보류',`${label} 전환에 필요한 재원이 부족합니다.`,'bad');save();render();return}S[src]-=n;S[dst]+=n;news('구단주 예산 전환',`${label} ${n}억을 직접 배정했습니다.${impact}`,'finance');save();render()}

  function executiveAction(a,v){ensureCore();if(a==='assistant-open'){S.view='staff';save();render();return}if(a==='assistant-toggle'){S.executive.open=!S.executive.open;save();render();return}if(a==='assistant-filter'){S.executive.filter=v;save();render();return}if(a==='assistant-select'){S.executive.selectedId=v;save();render();return}if(a==='assistant-hire'){const next=S.assistants.find(x=>x.id===S.executive.selectedId),old=executiveCandidate();if(!next)return;const cost=next.salary+(old&&old.id!==next.id?old.salary:0);if(S.cash<cost){news('비서 채용 보류',`${next.name} 비서의 첫 달 급여${old&&old.id!==next.id?'와 기존 비서 정산':' '}를 포함해 ${cost}억이 필요합니다.`,'bad');save();render();return}if(old&&old.id!==next.id)news('전속 비서 교체',`${old.name} 비서에게 1개월 정산 ${old.salary}억을 지급했습니다.`,'finance');S.cash-=cost;S.executive.hiredId=next.id;S.executive.lastPaidWeek=S.week;S.executive.open=true;S.executive.lastAction=`${next.primary} 중심으로 업무 호출을 준비했습니다.`;news('전속 비서 채용',`${next.name} 비서를 채용했습니다. 종합 능력치 ${next.rating}, 월 급여 ${next.salary}억입니다.`,'gold');save();render();return}if(a==='assistant-call'){const c=executiveCandidate();if(!c)return;const boost=k=>Math.max(1,Math.round(c.skills[k]/25));if(v==='player'){const p=player();p.morale=cap(p.morale+boost('relation'));p.promiseStatus=p.promiseWeeks>0?'비서 동행 점검':'관계 대화 완료';S.unity=cap(S.unity+1);news('비서 호출 · 선수 대화',`${c.name} 비서가 ${p.name}의 ${p.promise} 관련 대화를 정리했습니다. 사기와 라커룸 신뢰가 개선됐습니다.`,'contract')}if(v==='manager'){S.manager=cap(S.manager+boost('relation'));news('비서 호출 · 감독 대화',`${c.name} 비서가 감독의 경기·선수단 요청을 정리했습니다. 감독 신뢰가 상승했습니다.`,'info')}if(v==='media'){S.fans=cap(S.fans+boost('media'));S.reputation=cap(S.reputation+Math.max(1,boost('media')-1));news('비서 호출 · 인터뷰 요청',`${c.name} 비서가 기자 인터뷰와 팬 공지를 준비했습니다. 미디어 리스크가 완화됐습니다.`,'media')}if(v==='transfer'){const t=target();t.report=Math.min(98,t.report+boost('negotiation')*4);if(t.stage==='unscouted')t.stage='scouting';news('비서 호출 · 이적·계약 메모',`${c.name} 비서가 ${t.name}의 에이전트 조건과 경쟁 입찰 정보를 정리했습니다.`,'transfer')}if(v==='calendar'){S.warRoom.deadline=Math.min(14,S.warRoom.deadline+boost('operations'));S.assistant.deferred=Math.max(0,S.assistant.deferred-1);news('비서 호출 · 일정·마감 정리',`${c.name} 비서가 마감과 이사회 보고 순서를 재정렬했습니다. 워룸 대응 시간이 확보됐습니다.`,'calendar')}if(v==='report'){const risk=S.squad.filter(p=>p.fatigue>=45||p.flag==='계약 우려').slice(0,3);news('비서 호출 · 선수단 리포트',`${c.name} 비서가 ${risk.map(p=>p.name).join('·')||'선수단'}의 피로·계약·출전 위험을 요약했습니다.`,'squad')}S.executive.lastAction={player:'선수 대화 결과를 정리했습니다.',manager:'감독 요청을 정리했습니다.',media:'인터뷰·팬 공지를 준비했습니다.',transfer:'이적·계약 메모를 갱신했습니다.',calendar:'일정·마감을 재정렬했습니다.',report:'선수단 위험 보고를 전달했습니다.'}[v]||S.executive.lastAction;save();render();return}}
  function lifeView(){ensureCore();const c=executiveCandidate(),l=S.life,p=S.personal,people=[...S.people,...S.staff,...S.squad.filter(x=>x.squad!=='youth')],tab=p.investTab||'realty',labels={realty:'부동산',stocks:'주식',crypto:'가상자산'},advice=c?`${c.name} 비서 · ${tab==='realty'?'운영':'분석'} 능력 ${tab==='realty'?c.skills.operations:c.skills.analysis}`:'비서 미채용 · 자체 판단';root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">OWNER LIFE / PERSONAL CAPITAL / SIMULATED ASSETS</div><h2>구단주 라이프·개인 자산</h2></div><p>개인 자산과 투자 결과는 현실 금융 조언이 아닌 게임 속 가상 운영 요소입니다. 구단 운영자금과 개인 자산은 별도 장부로 관리됩니다.</p></div><section class="panel"><div class="head" style="margin-top:0"><div><div class="eyebrow">PERSONAL CAPITAL DESK</div><h3>개인 돈 설정·자산 장부</h3></div><small>개인 자산은 구단 운영자금과 분리됩니다.</small></div><div class="info"><div>개인 자산<b>${p.cash}억</b></div><div>선택 주거<b>${ownerHomes.find(h=>h[0]===p.home)?.[1]||'미선택'}</b></div><div>보유 투자<b>${p.investments.length}건</b></div><div>오늘 선물<b>${p.lastGiftWeek===S.week?'사용 완료':'가능'}</b></div></div><div class="actions" style="margin-top:14px"><label>개인 돈 설정<input id="personalCashInput" class="input paper" type="number" min="0" max="99999" value="${p.cash}"></label><button class="btn gold" data-a="life" data-v="personal-cash">개인 돈 적용</button></div></section><div class="split" style="margin-top:17px"><section class="panel"><div class="head" style="margin-top:0"><h3>일일 선물·호감도</h3><small>모든 대상은 성인 가상 인물 · 주차당 1회</small></div><p>선물은 선택한 성인 가상 인물이 자발적으로 수령한 경우에만 호감도에 반영됩니다. 같은 주에는 한 번만 보낼 수 있습니다.</p><div class="actions"><label>대상<select id="lifeGiftTarget" class="input paper">${people.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.kind||x.role||'선수')} · 호감도 ${x.interest||x.relation||50}</option>`).join('')}${c?`<option value="assistant">${esc(c.name)} · 전속 비서 · 호감도 ${S.executive.interest}</option>`:''}</select></label><label>선물<select id="lifeGiftItem" class="input paper">${ownerShop.filter(x=>x[4]==='선물').map(x=>`<option value="${x[0]}">${x[1]} · ${x[2]}억 · 호감도 +${x[3]}</option>`).join('')}</select></label><button class="btn gold" data-a="life" data-v="gift-send">오늘 선물 보내기</button></div></section><aside class="detail"><div class="eyebrow">OWNER BROADCAST STATION</div><h2>구단주 방송국</h2><p>인터뷰 요청과 팬 공지를 콘텐츠로 연결해 구독자·광고 수입·구단 평판을 관리합니다.</p><div class="info"><div>상태<b>${l.station?'운영 중':'미개설'}</b></div><div>구독자<b>${l.subscribers.toLocaleString()}명</b></div><div>월간 광고<b>${l.adRevenue}억</b></div><div>평판<b>${S.reputation}</b></div></div><div class="actions"><button class="btn gold" data-a="life" data-v="station">${l.station?'인터뷰 콘텐츠 제작':'방송국 개설 · 구단 25억'}</button></div></aside></div><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><h3>자가·주거 선택 · 12개</h3><small>개인 자산으로 선택하며 접견·콘텐츠·회복 효과가 다릅니다.</small></div><div class="actions">${ownerHomes.map(h=>`<button class="btn ${p.home===h[0]?'gold':'light'}" data-a="life" data-v="personal-home:${h[0]}">${h[1]} · ${h[2]}억</button>`).join('')}</div><p>${ownerHomes.find(h=>h[0]===p.home)?.[3]||''}</p></section><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><h3>쇼핑·업무지원 · 15개</h3><small>구매 이력은 개인 장부에 남고, 업무·미디어·상업 지원은 주간 효과에 연결됩니다.</small></div><div class="actions">${ownerShop.map(x=>`<button class="btn light" data-a="life" data-v="shop:${x[0]}">${x[1]} · ${x[2]}억 · ${x[4]}</button>`).join('')}</div></section><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><div><div class="eyebrow">PERSONAL INVESTMENT MARKET</div><h3>부동산·주식·가상자산 · 각 15종</h3></div><small>${advice}</small></div><p>추천 수익 확률은 전속 비서의 운영 또는 분석 능력치가 높을수록 상승합니다. 손실 가능성도 존재하는 게임 내 가상 투자입니다.</p><div class="tabs"><button class="${tab==='realty'?'active':''}" data-a="life" data-v="invest-tab:realty">부동산 15종</button><button class="${tab==='stocks'?'active':''}" data-a="life" data-v="invest-tab:stocks">주식 15종</button><button class="${tab==='crypto'?'active':''}" data-a="life" data-v="invest-tab:crypto">가상자산 15종</button></div><div class="table-wrap"><table><thead><tr><th>자산</th><th>매입가</th><th>위험도</th><th>비서 추천 확률</th><th>상태</th></tr></thead><tbody>${investmentCatalog[tab].map(x=>{const held=p.investments.find(i=>i.id===x[0]),skill=c?(tab==='realty'?c.skills.operations:c.skills.analysis):45,chance=Math.min(88,Math.max(32,42+skill*.34-x[3]*.16));return`<tr><td><b>${x[1]}</b></td><td>${x[2]}억</td><td>${x[3]}</td><td>${chance}%</td><td><button class="btn ${held?'light':'gold'}" ${held?'disabled':''} data-a="life" data-v="invest:${tab}:${x[0]}">${held?`보유 ${held.value}억`:'매입'}</button></td></tr>`}).join('')}</tbody></table></div></section><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><h3>저장·불러오기</h3><small>현재 브라우저 로컬 저장소에만 보관</small></div><p>자동 저장과 별도로 3개의 수동 저장 슬롯을 사용할 수 있습니다. 불러오기는 현재 진행을 해당 슬롯 상태로 교체합니다.</p><div class="actions">${[1,2,3].map(n=>`<div class="card"><b>슬롯 ${n}</b><p>${manualLabel(n)}</p><button class="btn gold" data-a="life" data-v="save-slot:${n}">현재 진행 저장</button><button class="btn light" data-a="life" data-v="load-slot:${n}" ${manualSlot(n)?'':'disabled'}>이 슬롯 불러오기</button></div>`).join('')}</div></section>`)}
  function lifeAction(v){ensureCore();const c=executiveCandidate(),l=S.life,p=S.personal,findPerson=id=>id==='assistant'?c:[...S.people,...S.staff,...S.squad].find(x=>x.id===id);if(v==='personal-cash'){p.cash=Math.max(0,Math.min(99999,Math.floor(Number(document.querySelector('#personalCashInput')?.value)||0)));news('개인 자산 설정',`구단주 개인 자산을 ${p.cash}억으로 설정했습니다. 개인 자산은 구단 운영자금과 분리됩니다.`,'finance')}else if(v==='gift-send'){const targetId=document.querySelector('#lifeGiftTarget')?.value,item=ownerShop.find(x=>x[0]===document.querySelector('#lifeGiftItem')?.value),target=findPerson(targetId);if(p.lastGiftWeek===S.week){news('선물 전달 보류','같은 주에는 선물을 한 번만 전달할 수 있습니다. 다음 주요 일정 후 다시 선택하세요.','info')}else if(!item||!target||p.cash<item[2]){news('선물 전달 보류','개인 자산 또는 대상 선택을 확인해 주세요.','bad')}else{p.cash-=item[2];p.lastGiftWeek=S.week;if(targetId==='assistant'){if(c.consent){S.executive.interest=cap(S.executive.interest+item[3]);news('선물 수령',`${c.name} 비서가 자발적으로 ${item[1]}을(를) 수령했습니다. 호감도 +${item[3]}이 기록됐습니다.`,'gold')}else news('선물 전달','상대가 업무 관계를 유지하며 선물은 정중히 수령하지 않았습니다.','info')}else{target.interest=cap((target.interest||target.relation||50)+item[3]);if(target.kind==='스태프')target.relation=cap((target.relation||50)+item[3]);news('선물 수령',`${target.name}이(가) 자발적으로 ${item[1]}을(를) 수령했습니다. 호감도 +${item[3]}이 기록됐습니다.`,'gold')}}}else if(v==='date'){if(!c||S.executive.lastPersonalWeek===S.week||S.executive.interest<60||!c.consent){news('데이트 제안 보류',!c?'전속 비서를 먼저 채용하세요.':S.executive.lastPersonalWeek===S.week?'오늘은 이미 개인 시간을 사용했습니다. 다음 주요 일정 후 다시 제안할 수 있습니다.':S.executive.interest<60?'호감도 60 이상과 상대의 자발적 수락이 필요합니다.':'상대가 현재 업무 관계 유지를 선택했습니다.','info')}else{S.executive.lastPersonalWeek=S.week;S.executive.interest=cap(S.executive.interest+8);S.executive.relationStatus='알아가는 중';news('전속 비서 · 데이트 수락',`${c.name} 비서가 자발적으로 식사 제안을 수락했습니다. 호감도와 상호 신뢰가 상승했습니다.`,'gold')}}else if(v==='romance'){if(!c||S.executive.interest<80||!c.consent){news('연애 제안 보류','호감도 80 이상과 상대의 명시적 수락이 필요합니다.','info')}else{S.executive.relationStatus='교제 중';S.executive.interest=cap(S.executive.interest+4);news('전속 비서 · 연애 제안 수락',`${c.name} 비서가 자발적으로 연애 제안을 수락했습니다. 관계는 업무 경계와 상호 존중 원칙을 유지합니다.`,'gold')}}else if(v==='station'){if(!l.station){if(S.cash<25){news('방송국 개설 보류','개설비 25억의 운영자금이 필요합니다.','bad')}else{S.cash-=25;l.station=true;l.subscribers=12000;l.adRevenue=1;news('구단주 방송국 개설','인터뷰·팬 공지·구단 다큐를 위한 방송국을 개설했습니다.','media')}}else{l.subscribers+=Math.max(1500,Math.round((S.fans+S.reputation)*55));l.adRevenue=Math.min(8,Number((l.adRevenue+.4).toFixed(1)));S.reputation=cap(S.reputation+3);news('방송국 인터뷰 콘텐츠','구단주 인터뷰와 비서가 준비한 팬 공지가 공개돼 구독자·평판이 상승했습니다.','media')}}else if(v.startsWith('personal-home:')){const h=ownerHomes.find(x=>x[0]===v.split(':')[1]);if(!h||p.cash<h[2])news('주거 선택 보류','개인 자산이 부족합니다.','bad');else{p.cash-=h[2];p.home=h[0];S.reputation=cap(S.reputation+Math.max(1,Math.round(h[2]/80)));news('구단주 주거 변경',`${h[1]}을(를) 선택했습니다. ${h[3]} 효과가 개인 장부에 기록됐습니다.`,'life')}}else if(v.startsWith('shop:')){const item=ownerShop.find(x=>x[0]===v.split(':')[1]);if(!item||p.cash<item[2])news('쇼핑 보류','개인 자산이 부족합니다.','bad');else{p.cash-=item[2];p.shop.push(item[0]);if(item[4]==='운영'){S.assistant.lastAction=`${item[1]} 구매로 업무지원 준비가 강화됐습니다.`;S.warRoom.deadline=Math.min(14,S.warRoom.deadline+1)}if(item[4]==='미디어')S.reputation=cap(S.reputation+2);if(item[4]==='상업')S.board=cap(S.board+1);if(item[4]==='회복')S.unity=cap(S.unity+2);news('개인 쇼핑·업무지원',`${item[1]}을(를) 구매했습니다. ${item[4]} 지원 효과가 기록되었습니다.`,'finance')}}else if(v.startsWith('invest-tab:')){p.investTab=v.split(':')[1]}else if(v.startsWith('invest:')){const [,cat,id]=v.split(':'),row=(investmentCatalog[cat]||[]).find(x=>x[0]===id),skill=c?(cat==='realty'?c.skills.operations:c.skills.analysis):45;if(!row||p.investments.some(x=>x.id===id)||p.cash<row[2])news('개인 투자 보류','개인 자산 또는 선택 종목을 확인해 주세요.','bad');else{p.cash-=row[2];p.investments.push({id,name:row[1],category:cat,cost:row[2],value:row[2],risk:row[3],advisorId:c?.id||null,lastWeek:S.week-1});news('개인 투자 매입',`${row[1]}에 개인 자산 ${row[2]}억을 배정했습니다. ${c?`${c.name} 비서의 능력치 ${skill} 추천이 반영됩니다.`:'비서 미채용 상태의 자체 판단입니다.'} 실제 금융 조언이 아닌 게임 내 가상 투자입니다.`,'finance')}}else if(v.startsWith('save-slot:')){const n=v.split(':')[1];localStorage.setItem(manualKey(n),JSON.stringify(S));news('수동 저장 완료',`슬롯 ${n}에 ${S.season}시즌 ${S.week}주차 진행을 저장했습니다.`,'info')}else if(v.startsWith('load-slot:')){const n=v.split(':')[1],x=manualSlot(n);if(!x)news('불러오기 보류',`슬롯 ${n}이 비어 있습니다.`,'bad');else{S=normalize(x);ensureCore();S.executive.receipt=null;save();news('수동 불러오기 완료',`슬롯 ${n}의 ${S.season}시즌 ${S.week}주차 진행을 불러왔습니다.`,'gold')}}save();render()}
  const peopleList=()=>[...S.people,...S.staff.map(p=>({...p,kind:'스태프'})),...S.squad.filter(p=>p.squad!=='youth').map(p=>({...p,kind:'선수'}))];

  function peopleView(){ensureCore();const p=currentPerson(),eligible=S.profile.gender==='남성'?p.gender==='여성':S.profile.gender==='여성'?p.gender==='남성':true,fallback='assets/assistant_portrait_style_reference.jpg';root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">PEOPLE / TRUST / CONSENT</div><h2>인물 관계</h2></div><p>모든 프로필은 25세 이상 성인 가상 인물입니다. 대화는 구단 운영에 영향을 주며, 개인 제안은 자발적 수락과 하루 1회 제한을 따릅니다.</p></div><div class="split"><section class="panel"><div class="head" style="margin-top:0"><h3>핵심 인물</h3><small>프로필 이미지 · 호감도 · 대화 기록</small></div><div class="actions">${peopleList().slice(0,20).map(x=>`<button class="btn ${x.id===p.id?'gold':'light'}" data-a="people-select" data-v="${x.id}"><img src="${x.photo||fallback}" onerror="this.onerror=null;this.src='${fallback}'" style="width:25px;height:25px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px">${esc(x.name)} · ${x.kind}</button>`).join('')}</div></section><aside class="detail"><div style="display:flex;gap:14px;align-items:center"><img src="${p.photo||fallback}" onerror="this.onerror=null;this.src='${fallback}'" style="width:82px;height:82px;border-radius:50%;object-fit:cover"><div><div class="eyebrow">${esc(p.kind)} / ${esc(p.gender)} / ${p.age}세</div><h2>${esc(p.name)}</h2><p>호감도 ${p.interest||50} / 100 · ${S.peopleState.relations[p.id]||'업무 관계'}</p></div></div></aside></div><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><h3>대화 선택</h3><small>15개 대화는 결과 영수증과 구단 뉴스에 기록됩니다.</small></div><div class="actions">${dialogue.map((d,i)=>`<button class="btn light" data-a="people-talk" data-v="${i}">${d}</button>`).join('')}</div>${p.interest>=100?`<div class="actions" style="margin-top:16px"><button class="btn gold" data-a="people-introduce">성인 지인 소개 요청</button>${eligible?`<button class="btn gold" data-a="people-date">데이트 제안</button>`:''}</div>`:''}</section>`)}
  function peopleAction(a,v){const p=currentPerson();if(a==='people-select'){S.peopleState.selected=v;save();render();return}if(a==='people-talk'){const d=dialogue[Number(v)],gain=d==='경기 후 비판'?1:d==='개인 만남 제안'?0:3;p.interest=cap((p.interest||50)+gain);if(p.kind==='선수'){p.morale=cap(p.morale+(d==='칭찬'?5:gain));S.unity=cap(S.unity+1)}if(p.kind==='감독'||p.role==='감독')S.manager=cap(S.manager+gain);if(['기자','아나운서'].includes(p.kind)){S.reputation=cap(S.reputation+gain);S.fans=cap(S.fans+1)}if(p.kind==='스태프')p.relation=cap((p.relation||50)+gain);news(`인물 대화 · ${d}`,`${p.name}과 ${d}을(를) 진행했습니다. 호감도 +${gain}이 반영됐습니다.`,'info');save();render();return}if(a==='people-introduce'){if(p.interest<100){news('소개 요청 보류','호감도 100이 되어야 성인 지인 소개를 요청할 수 있습니다.','info')}else{news('성인 지인 소개',`${p.name}이(가) 구단주 프로필의 성별 설정에 맞는 성인 가상 지인을 소개해 주겠다고 했습니다. 상대의 자발적 수락이 확인될 때만 다음 단계가 열립니다.`,'gold')}save();render();return}if(a==='people-date'){if(S.peopleState.lastPersonalWeek===S.week){news('데이트 제안 보류','같은 날에는 개인 만남을 한 번만 제안할 수 있습니다.','info')}else if(!p.consent){news('데이트 제안 거절','상대가 업무 관계 유지를 선택했습니다. 거절은 존중되며 같은 날 재시도할 수 없습니다.','info');S.peopleState.lastPersonalWeek=S.week}else{S.peopleState.lastPersonalWeek=S.week;p.interest=cap((p.interest||100)+4);S.peopleState.relations[p.id]='알아가는 중';news('데이트 제안 수락',`${p.name}이(가) 자발적으로 개인 만남 제안을 수락했습니다. 호감도 +4와 관계 상태가 기록됐습니다.`,'gold')}save();render()}

  function campus(){ensureCore();const zones=[['office','구단주 사무실','비서 브리핑 · 이사회 온도','home','16%','73%'],['warroom','이적 워룸','마감일 · 후보 · 에이전트','transfers','69%','22%'],['training','1군 훈련장','피로 · 약속 · 주장단','squad','17%','19%'],['academy','유스 하우스','유스 · 리저브 · 콜업','staff','18%','44%'],['medical','메디컬 센터','재활 · 부상 보호','staff','43%','44%'],['scout','스카우트 센터','권역 보고 · 후보 풀','transfers','72%','46%'],['stadium','스타디움·광장','경기일 · 팬 · 티켓','calendar','46%','14%'],['studio','상업 스튜디오','스폰서 · 콘텐츠 · 지역','finance','73%','74%'],['assistant','비서 채용실','30명 후보 · 전속 호출','staff','70%','62%'],['archive','다이너스티 아카이브','영상 · 시즌 필름 · 역사','profile','45%','75%']];root.innerHTML=shell(`<section class="campus-page"><div class="campus-hero"><div class="eyebrow">CLUB CAMPUS / LIVE OPERATIONS</div><h2>${esc(getClub(S.clubId).name)}의<br>구단 캠퍼스</h2><p>건물은 메뉴의 그림이 아닙니다. 각 공간에는 이번 주 결재·마감·보고·공사 상태가 있습니다. 가장 급한 문부터 여십시오.</p></div><section class="campus-map">${zones.map(z=>`<button class="campus-zone ${S.campus.active===z[0]?'focus':''}" style="--x:${z[4]};--y:${z[5]}" data-a="campus" data-v="${z[0]}" data-dest="${z[3]}"><b>${z[1]}</b><span>${z[2]}</span><em>열기 ›</em></button>`).join('')}</section><section class="operations-grid"><article class="operations-card"><div class="eyebrow">ASSISTANT</div><h3>${executiveCandidate()?`${executiveCandidate().name} 호출`:'비서 채용실'}</h3><p>${executiveCandidate()?'선수·감독·인터뷰·협상·일정 업무를 즉시 지원합니다.':'30명의 성인 가상 후보를 능력치·연봉·전문 분야로 비교합니다.'}</p><button class="btn light campus-return" data-a="view" data-v="staff">비서 채용실 열기</button></article><article class="operations-card"><div class="eyebrow">PEOPLE</div><h3>인물 관계</h3><p>선수·감독·미디어·스태프의 호감도와 대화를 관리합니다.</p><button class="btn light campus-return" data-a="view" data-v="people">인물 관계 열기</button></article></section></section>`)}
  function coreAction(a,v,b){ensureCore();if(a==='campus-open'){S.campus.active='office';campus();return}if(a==='campus'){S.campus.active=v;S.view=b.dataset.dest||'home';news('캠퍼스 이동',`${b.querySelector('b')?.textContent||'구단 시설'}에서 이번 주 운영 안건을 확인합니다.`,'campus');save();render();return}if(a==='brief'){const t=assistantTasks()[0];if(v==='direct'){S.assistant.briefStatus={kind:'direct',title:'직접 검토로 이동',copy:`${t.title} 안건을 구단주가 직접 결재합니다.`};S.view=t.view;news('비서 브리핑 · 직접 검토',`${t.title} 안건을 구단주가 직접 결재합니다.`,'info');save();render();return}if(v==='defer'){S.assistant.deferred++;S.board=cap(S.board-1);S.warRoom.pressure++;S.assistant.briefStatus={kind:'defer',title:'한 주 보류 처리 완료',copy:`마감 압박 +1 · 이사회 신뢰 -1 · 누적 보류 ${S.assistant.deferred}회`};news('비서 브리핑 · 한 주 보류',`${t.title} 안건을 보류했습니다. 마감 압박과 이사회 우려가 높아집니다.`,'bad')}if(v==='delegate'){S.delegations.scout=true;S.relations.td=cap(S.relations.td+2);S.assistant.briefStatus={kind:'delegate',title:'부서 위임 처리 완료',copy:`스카우트 부서가 안건을 인계받았습니다. 기술 디렉터 신뢰 +2`};news('비서 브리핑 · 부서 위임',`${t.title}을 담당 부서에 위임했습니다.`,'info')}save();render();return}if(a==='warroom'){const t=target();if(v==='open'){S.view='transfers';news('워룸 정밀 검토',`${t.name}의 스카우트 보고와 에이전트 조건을 다시 열었습니다.`,'transfer')}if(v==='accelerate'){if(t.stage==='scouted'||t.stage==='ready')t.stage='talk';else if(t.stage==='agent')t.stage='board';S.warRoom.pressure++;news('협상 가속',`${t.name} 영입을 우선 처리했습니다. 경쟁 입찰 위험도 함께 높아집니다.`,'transfer')}if(v==='hold'){S.warRoom.deadline=Math.max(0,S.warRoom.deadline-1);t.rivalPressure=(t.rivalPressure||0)+1;news('워룸 보류',`${t.name} 협상을 보류했습니다. 경쟁 구단의 움직임을 지켜봅니다.`,'bad')}save();render();return}if(a==='promise'){const p=player();p.promiseWeeks=2;p.promiseStatus='확인됨';p.morale=cap(p.morale+4);S.unity=cap(S.unity+1);news('역할 약속 확인',`${p.name}에게 ${p.promise} 약속을 2주간 확인했습니다. 주장단이 구단주의 메시지를 라커룸에 전달합니다.`,'contract');save();render();return}if(a==='captain'){const p=player();if(v==='competition'){S.unity=cap(S.unity+3);p.promiseStatus='선발 경쟁 공개';news('주장단 회의 · 선발 경쟁',`선발 기준을 공개했습니다. 라커룸 결속은 높아졌지만 ${p.name}의 약속은 경기력으로 증명해야 합니다.`,'info')}if(v==='protect'){S.squad.filter(x=>x.squad==='first').forEach(x=>x.fatigue=Math.max(0,x.fatigue-5));S.fans=cap(S.fans-1);p.promiseStatus='부상 보호 우선';news('주장단 회의 · 부상자 보호',`단기 팬 기대보다 회복을 우선했습니다. 1군 피로가 완화됩니다.`,'info')}if(v==='youth'){const y=S.squad.find(x=>x.squad==='youth'&&x.ability>=x.potential-7);if(y){y.morale=cap(y.morale+8);y.promise='1군 콜업 검토';S.unity=cap(S.unity-1);news('주장단 회의 · 유스 콜업 선언',`${y.name}의 1군 콜업 가능성을 공개했습니다. 경쟁을 의식하는 일부 주전도 생겼습니다.`,'youth')}}save();render();return}}
  function landing(){root.innerHTML=`<main class="landing"><div class="landing-inner"><div class="eyebrow">CLUB DYNASTY 2026 / CLUB OWNERSHIP SIM</div><h1>한 경기의 결과보다,<br>한 구단의 왕조를 운영합니다.</h1><p>감독 AI가 경기 전술을 맡기고, 구단주는 1군·리저브·유스·스태프·이적·계약·재정·시설·팬과 이사회를 동시에 운영하는 장기 축구 구단 경영 게임입니다.</p><div class="landing-bottom"><section class="rule"><h2>리그1 15개 · 리그2 14개</h2><p>리그1 15위 직접 강등, 리그2 1위 직접 승격. 리그1 13·14위와 리그2 2·3위는 각각 단판 승강 플레이오프를 치릅니다.</p></section><div class="landing-actions">${load()?'<button class="btn gold" data-a="continue">저장된 다이너스티 이어하기</button>':''}<button class="btn ${load()?'light':'gold'}" data-a="new">새 구단주 다이너스티 시작</button></div></div></div></main>`}
  function setup(){const c=getClub(S.clubId);root.innerHTML=`<main class="setup"><div class="setup-inner"><div class="eyebrow">club dynasty / new ownership</div><h1>당신은 누구이며,<br>어느 구단을 이끌겠습니까?</h1><p class="lead">개인 프로필과 인수 방식은 이사회·팬·상업 부서가 당신을 대하는 방식에 남습니다. 선택한 구단은 61명 선수단·14명 스태프·글로벌 스카우트 네트워크의 출발 조건을 결정합니다.</p><div class="step"><span class="on">01 구단주 프로필</span><span class="on">02 인수 대상</span><span>03 다이너스티 허브</span></div><section class="setup-panel">${ownerFields()}<label class="label">인수 방식</label><div class="owner-grid">${Object.entries(owners).map(([k,o])=>`<button class="owner-choice ${S.profile.type===k?'selected':''}" data-a="owner" data-v="${k}"><b>${o.name}</b><small>${o.copy}<br>시작 운영 자금 ${o.cash}억</small></button>`).join('')}</div><label class="label">30개 구단 인수 시장</label><div class="market"><div><div class="switch"><button class="${S.marketLeague==='L1'?'active':''}" data-a="market" data-v="L1">개리그1 · 14개 구단</button><button class="${S.marketLeague==='L2'?'active':''}" data-a="market" data-v="L2">개리그2 · 16개 구단</button></div><div class="club-grid">${clubs.filter(x=>x.league===S.marketLeague).map(x=>`<button class="club-choice ${x.id===S.clubId?'selected':''}" data-a="team" data-v="${x.id}"><b>${x.name}</b><span>${x.city} · 전력 ${x.power} · 팬 ${x.fans} · 난이도 ${x.cost}</span></button>`).join('')}</div></div><aside class="brief"><div class="eyebrow">ACQUISITION BRIEF</div><h2>${c.name}</h2><p>${c.city}의 ${leagueName(c.league)} 구단입니다. 첫 이사회 과제는 <b>“${c.challenge}”</b>입니다.</p><div class="brief-grid"><div>전력<b>${c.power}</b></div><div>팬 기반<b>${c.fans}</b></div><div>시설<b>${c.facility}</b></div><div>인수 난이도<b>${c.cost}</b></div></div><button class="btn gold" style="width:100%" data-a="start">이 구단의 경영권 인수</button></aside></div></section></div></main>`}
  function profileView(){const p=S.profile,c=getClub(S.clubId),o=owners[p.type]||owners.local,m=S.managerCandidate;root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">OWNER PROFILE / CLUB DYNASTY</div><h2>구단주 프로필</h2></div><p>이 프로필은 이사회와 팬, 영입 발표, 계약 서명, 구단 연대기에서 당신의 경영 정체성으로 남습니다.</p></div><div class="profile-grid"><section class="profile-hero">${ownerPortrait(true)}<div><div class="eyebrow">${esc(o.name).toUpperCase()} · ${esc(c.city)}</div><h2>${esc(ownerName())}</h2><p>${esc(p.career)} 경력으로 ${esc(c.name)}의 경영권을 맡았습니다. 당신이 만든 선택은 구단의 재정과 선수단뿐 아니라 팬이 기억하는 클럽의 성격을 바꿉니다.</p><div class="profile-facts"><div>나이<b>${esc(p.age)}세</b></div><div>키<b>${esc(p.height)}cm</b></div><div>인수 방식<b>${esc(o.name)}</b></div><div>커리어 시작<b>${S.season}년</b></div></div></div></section><section class="panel"><div class="head" style="margin-top:0"><h3>프로필 편집</h3><small>사진은 이 브라우저 안에만 보관</small></div>${ownerFields(true)}<p class="profile-note">업로드한 사진을 지우려면 아래 버튼을 사용하세요. 본인의 사진이나 사용 권한이 있는 이미지만 사용해 주세요.</p><div class="actions"><button class="btn light" data-a="photo-clear">프로필 사진 기본 아바타로 되돌리기</button><button class="btn gold" data-a="view" data-v="home">구단 허브로 돌아가기</button></div></section></div><section class="cinematic-card" style="margin-top:18px"><div class="eyebrow">DYNASTY MOMENTS / VISUAL STORY</div><h3>중요한 계약은<br>하나의 장면으로 남습니다.</h3><p>구단 인수, 선수 영입, 감독 선임이 완료될 때 시네마틱 포스터와 선택형 영상 연출을 제공합니다. 재생을 건너뛰어도 계약·저장·다음 주 진행은 동일하게 완료됩니다.</p><div class="chips"><span>구단 인수</span><span>선수 영입</span><span>감독 선임</span><span>선택형 재생</span></div><div class="actions" style="max-width:520px"><button class="btn light" data-a="cinema" data-v="acquisition">구단 인수 장면 보기</button><button class="btn light" data-a="cinema" data-v="player">선수 영입 장면 보기</button><button class="btn light" data-a="cinema" data-v="manager">감독 선임 장면 보기</button><button class="btn gold" data-a="manager-appoint">${esc(m.name)} 감독 선임 · 평가 ${m.rating}</button></div></section>`)}
  function home(){const active=S.targets.filter(t=>['scouting','scouted','observe','ready','talk','agent','board'].includes(t.stage)).length+S.projects.filter(p=>p.state==='construction').length,events=eventsList();root.innerHTML=shell(`<section class="hero"><div class="eyebrow">CLUB NEWS CENTRE</div><h2>${esc(getClub(S.clubId).name)}의 운영은<br>이번 주 여러 개의 시계 위에 놓여 있습니다.</h2><p>이적과 재계약, 리저브·유스 성장, 시설 공사, 스태프 보고, 감독 AI 경기일은 따로 끝나지 않습니다. 직접 결재할 일과 위임할 일을 구분하고 그 대가를 준비하십시오.</p><div class="chips"><span>${leagueName(S.league)} ${mine().rank}위</span><span>이사회 ${S.board}</span><span>감독 ${S.manager}</span><span>라커룸 ${S.unity}</span><span>1군 ${gcount('first')}명</span><span>리저브 ${gcount('reserve')}명</span><span>유스 ${gcount('youth')}명</span><span>진행 업무 ${active}건</span></div></section><div class="dashboard"><div><div class="head"><h3>오늘의 운영 우선순위</h3><small>최대 두 건만 직접 결재 권장</small></div><div class="tasks">${tasks().map(t=>`<button class="task ${t.urgent?'urgent':''}" data-a="view" data-v="${t.view}"><i>${t.icon}</i><span><b>${t.title}</b><span>${t.copy}</span></span><em>${t.deadline}</em></button>`).join('')}</div><div class="head"><h3>경영 데스크</h3><small>시간이 지나도 선택은 남습니다</small></div><div class="desk"><article class="card"><h3>이적·스카우트</h3><p>${S.targets.length}명 후보 풀에서 ${S.targets.filter(t=>t.stage==='scouted').length}명의 보고가 도착했습니다. 지역·포지션·연령을 분리해 검토하십시오.</p><button class="btn" data-a="view" data-v="transfers">이적 시장 열기</button></article><article class="card goldline"><h3>계약·선수단</h3><p>1군·리저브·유스가 한 자산입니다. 계약 기한, 역할 약속, 피로, 콜업·임대 계획을 관리하십시오.</p><button class="btn light" data-a="view" data-v="squad">선수단 운영</button></article><article class="card"><h3>스태프·유스</h3><p>14명 스태프의 부서 평가는 성장·부상·보고 정확도·상업 협상에 장기 영향을 줍니다.</p><button class="btn light" data-a="view" data-v="staff">직원 센터</button></article><article class="card goldline"><h3>재정·시설</h3><p>이적 ${S.transfer}억, 인프라 ${S.infrastructure}억. 시설은 공사 기간과 유지비를 동반합니다.</p><button class="btn light" data-a="view" data-v="finance">재정 계획</button></article></div></div><aside><div class="head"><h3>구단 체온</h3><small>권한의 현재 조건</small></div><div class="kpis">${kpi('운영 자금',`${S.cash}억`,S.cash>50?'유동성 확보':'현금 주의',S.cash>50?'good':'bad')}${kpi('이적 예산',`${S.transfer}억`,'협상 가능','good')}${kpi('급여 여유',`${Math.max(0,Math.round(S.wageCap-S.wages))}억`,S.wageCap-S.wages>7?'여유 있음':'한도 근접',S.wageCap-S.wages>7?'good':'warn')}${kpi('팬 신뢰',S.fans,S.fans>55?'지지':'거리감',S.fans>55?'good':'bad')}</div><section class="calendar-short"><div class="eyebrow">UPCOMING</div><h3>이번 주와 다음 주</h3>${events.slice(0,4).map(e=>`<div class="event"><b>${e.when}</b><div><strong>${e.title}</strong><span>${e.copy}</span></div></div>`).join('')}</section></aside></div>`)}
  const kpi=(n,v,c,cl)=>`<div class="kpi"><div><span>${n}</span><b>${v}</b></div><em class="${cl}">${c}</em></div>`;
  function tasks(){const a=[];const t=S.targets.find(x=>['agent','board','ready','scouted'].includes(x.stage));if(t)a.push({icon:'⇄',view:'transfers',title:`${t.name} · ${stage(t.stage)}`,copy:t.stage==='agent'?'에이전트 조건에 응답해야 합니다.':t.stage==='board'?'이사회·CFO 승인을 기다립니다.':'다음 스카우트·협상 결정을 확인하십시오.',deadline:t.stage==='agent'?'오늘':'이번 주',urgent:t.stage==='agent'});const p=S.squad.find(x=>x.deal==='agent'||x.flag==='재계약'||x.flag==='계약 우려');if(p)a.push({icon:'계',view:'squad',title:`${p.name} · ${p.flag}`,copy:p.deal==='agent'?'에이전트 조건이 도착했습니다.':`${p.promise} 약속과 계약 기한을 점검하십시오.`,deadline:'2주 내',urgent:p.flag==='재계약'});const y=S.squad.find(x=>x.squad==='youth'&&x.ability>=x.potential-4);if(y)a.push({icon:'유',view:'staff',title:`${y.name} · 유스 졸업 검토`,copy:'프로 계약 또는 리저브 승격을 검토할 성장 구간입니다.',deadline:'이번 달'});const pr=S.projects.find(x=>x.state==='construction');if(pr)a.push({icon:'⌘',view:'facilities',title:`${pr.name} 공사 진행`,copy:`완공까지 ${pr.weeks}주. 매주 ${pr.weekly}억이 지출됩니다.`,deadline:'진행 중'});if(!a.length)a.push({icon:'✓',view:'calendar',title:'직접 결재 대기 안건 없음',copy:'다음 주요 일정 또는 장기 계획을 확인하십시오.',deadline:'운영 가능'});return a.slice(0,4)}
  function squad(){const p=player(),list=S.squad.filter(x=>x.squad===S.squadTab&&x.deal!=='sold');root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">SQUAD / CONTRACTS / DEVELOPMENT</div><h2>선수단과 계약</h2></div><p>1군의 성과, 리저브의 경기 감각, 유스의 성장 곡선은 하나의 자산입니다. 역할 약속과 계약 기한은 감독 AI 경기와 이적시장에 연결됩니다.</p></div><div class="tabs"><button class="${S.squadTab==='first'?'active':''}" data-a="squadtab" data-v="first">1군 ${gcount('first')}명</button><button class="${S.squadTab==='reserve'?'active':''}" data-a="squadtab" data-v="reserve">리저브 ${gcount('reserve')}명</button><button class="${S.squadTab==='youth'?'active':''}" data-a="squadtab" data-v="youth">유스 ${gcount('youth')}명</button></div><div class="split"><div><div class="panel" style="margin-bottom:14px"><div class="head" style="margin-top:0"><h3>${S.squadTab==='first'?'라커룸·경기 준비':S.squadTab==='reserve'?'리저브·임대·콜업':'유스 아카데미·프로 계약'}</h3><small>감독 AI가 능력·폼·피로·약속을 반영</small></div><div class="chips" style="margin:0"><span style="border-color:var(--line);color:var(--ink)">평균 능력 ${Math.round(list.reduce((a,x)=>a+x.ability,0)/Math.max(1,list.length))}</span><span style="border-color:var(--line);color:var(--ink)">평균 사기 ${Math.round(list.reduce((a,x)=>a+x.morale,0)/Math.max(1,list.length))}</span><span style="border-color:var(--line);color:var(--ink)">계약 위험 ${S.squad.filter(x=>x.flag==='계약 우려'||x.flag==='재계약').length}명</span></div></div><div class="table-wrap"><table><thead><tr><th>포지션</th><th>선수</th><th>나이</th><th>역할·약속</th><th>능력/잠재</th><th>폼·피로</th><th>계약</th><th>상태</th></tr></thead><tbody>${list.map(x=>`<tr class="row ${x.id===p.id?'mine':''}" data-a="player" data-v="${x.id}"><td>${x.pos}</td><td><b>${x.name}</b><br><small>${x.nationality}</small></td><td>${x.age}</td><td>${x.role}<br><small>${x.promise}</small></td><td>${x.ability} / ${x.potential}</td><td>${x.form} · ${x.fatigue}</td><td>${x.contract}<br><small>${x.contractWeeks}주</small></td><td><span class="status ${x.flag==='안정'||x.flag==='재계약 완료'?'good':'bad'}">${x.flag}</span></td></tr>`).join('')}</tbody></table></div></div><aside class="detail"><div class="eyebrow">PLAYER BRIEF / ${p.squad.toUpperCase()}</div><h2>${p.name}</h2><div class="big">${p.ability}<span style="font-size:17px;color:var(--muted)"> / ${p.potential}</span></div><p>${p.notes} 현재 원하는 것은 <b>${p.promise}</b>입니다.</p><div class="info"><div>사기<b>${p.morale}</b></div><div>피로<b>${p.fatigue}</b></div><div>시장 가치<b>${p.marketValue}억</b></div><div>계약<b>${p.contractWeeks}주</b></div></div><div class="actions">${p.deal==='none'?'<button class="btn gold" data-a="contract" data-v="meet">면담·재계약 시작</button>':''}${p.deal==='agent'?'<button class="btn gold" data-a="contract" data-v="accept">요구안 수용 · 다음 주 서명</button><button class="btn light" data-a="contract" data-v="counter">성과 보너스 역제안</button>':''}${p.deal==='signed'?'<button class="btn light" disabled>계약 완료</button>':''}${p.squad!=='first'?'<button class="btn light" data-a="contract" data-v="promote">1군 콜업</button>':''}${p.squad==='first'?'<button class="btn light" data-a="contract" data-v="reserve">리저브 이동</button>':''}${p.deal!=='sold'?'<button class="btn red" data-a="contract" data-v="sale">방출·매각 명단 등록</button>':''}<button class="btn light" data-a="talk" data-v="captain">주장과 라커룸 면담</button></div></aside></div>`)}
  function transfers(){const t=target(),filtered=S.targets.filter(x=>(S.targetRegion==='ALL'||x.region===S.targetRegion)&&(S.targetType==='ALL'||x.type===S.targetType)),page=Math.min(S.targetPage,Math.max(0,Math.ceil(filtered.length/20)-1)),pageList=filtered.slice(page*20,page*20+20);root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">TRANSFER / SCOUTING NETWORK</div><h2>이적 시장과 스카우트</h2></div><p>${S.targets.length}명 후보 풀을 권역·유형별로 관찰합니다. 완전한 정보는 스카우트 보고, 협상, 이사회 결재를 거쳐야 얻습니다.</p></div><div class="filters"><button class="${S.targetRegion==='ALL'?'active':''}" data-a="region" data-v="ALL">전체</button>${regions.map(r=>`<button class="${S.targetRegion===r?'active':''}" data-a="region" data-v="${r}">${r}</button>`).join('')}<button class="${S.targetType==='유망주'?'active':''}" data-a="type" data-v="유망주">유망주</button><button class="${S.targetType==='즉시 전력'?'active':''}" data-a="type" data-v="즉시 전력">즉시 전력</button></div><div class="split"><div><div class="panel" style="margin-bottom:14px"><div class="head" style="margin-top:0"><h3>스카우트 네트워크</h3><small>자동 배정 ${S.delegations.scout?'활성':'수동'} · 현재 범위 ${S.scoutScope}</small></div><div class="tabs" style="margin:0">${regions.map(r=>`<button class="${S.scoutScope===r?'active':''}" data-a="scope" data-v="${r}">${r}</button>`).join('')}</div></div><div class="table-wrap"><table><thead><tr><th>선수</th><th>권역·소속</th><th>포지션</th><th>나이</th><th>능력/잠재</th><th>이적료</th><th>연봉</th><th>보고</th><th>상태</th></tr></thead><tbody>${pageList.map(x=>`<tr class="row ${x.id===t.id?'mine':''}" data-a="target" data-v="${x.id}"><td><b>${x.name}</b><br><small>${x.type}</small></td><td>${x.region}<br><small>${x.club}</small></td><td>${x.pos}</td><td>${x.age}</td><td>${x.report>=50?`${x.ability} / ${x.potential}`:'?'}</td><td>${x.report>=50?`${x.fee}억`:'?'}</td><td>${x.report>=50?`${x.wage}억`:'?'}</td><td>${x.report}%</td><td><span class="status ${x.stage==='signed'?'good':x.stage==='lost'?'bad':'warn'}">${stage(x.stage)}</span></td></tr>`).jo   function staff(){const s=staffer(),list=S.staff.filter(x=>S.staffDepartment==='ALL'||x.department===S.staffDepartment);root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">STAFF / RESERVE / YOUTH</div><h2>스태프와 유스 운영</h2></div><p>14명의 스태프는 단순 장식이 아닙니다. 코칭·의료·스카우트·재정·상업 부서의 평가는 성장, 회복, 보고 정확도, 현금흐름에 반영됩니다.</p></div><div class="tabs"><button class="${S.staffDepartment==='ALL'?'active':''}" data-a="dept" data-v="ALL">전체 14명</button>${['기술 조직','의료 조직','스카우트 조직','경영 조직'].map(x=>`<button class="${S.staffDepartment===x?'active':''}" data-a="dept" data-v="${x}">${x}</button>`).join('')}</div><div class="split"><div><div class="panel" style="margin-bottom:14px"><div class="head" style="margin-top:0"><h3>위임 정책</h3><small>자동은 속도를, 수동은 통제를 제공합니다</small></div><div class="chips" style="margin:0"><span style="border-color:var(--line);color:var(--ink)">자동 스카우트 ${S.delegations.scout?'ON':'OFF'}</span><span style="border-color:var(--line);color:var(--ink)">자동 유스 보고 ${S.delegations.youth?'ON':'OFF'}</span><span style="border-color:var(--line);color:var(--ink)">상업 자동 선별 ${S.delegations.commercial?'ON':'OFF'}</span></div></div><div class="table-wrap"><table><thead><tr><th>직원</th><th>부서</th><th>역할</th><th>평가</th><th>계약</th><th>연봉</th><th>현재 과제</th></tr></thead><tbody>${list.map(x=>`<tr class="row ${x.id===s.id?'mine':''}" data-a="staff" data-v="${x.id}"><td><b>${x.name}</b></td><td>${x.department}</td><td>${x.role}</td><td>${x.rating}</td><td>${x.contractWeeks}주</td><td>${x.wage}억</td><td>${x.focus}</td></tr>`).join('')}</tbody></table></div><section class="panel" style="margin-top:14px"><div class="head" style="margin-top:0"><h3>유스·리저브 보고</h3><small>긴 커리어를 위한 다음 세대</small></div><p>리저브 ${gcount('reserve')}명 중 ${S.squad.filter(p=>p.squad==='reserve'&&p.ability>=68).length}명이 콜업 후보입니다. 유스 ${gcount('youth')}명 중 ${S.squad.filter(p=>p.squad==='youth'&&p.potential>=78).length}명이 상위 잠재력으로 평가됩니다. 유스 기숙사·훈련 분석실·유스 코치의 평가는 매월 성장 보고에 반영됩니다.</p></section></div><aside class="detai   function financeView(){const mandate=S.boardMandate||'promotion';root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">FINANCE / COMMERCIAL / CLUB VOICE</div><h2>재정·상업·구단의 목소리</h2></div><p>예산표만 관리하지 않습니다. 티켓과 스폰서, 팬·언론 메시지, 이사회 전략은 수익·평판·감독 신뢰·다음 월간 평가를 서로 다르게 바꿉니다.</p></div><div class="finance">${fcard('운영 자금',`${S.cash}억`,'유동성')}${fcard('이적 예산',`${S.transfer}억`,'영입·매각 재원')}${fcard('급여 한도',`${S.wages.toFixed(1)} / ${S.wageCap}억`,'선수·스태프 급여')}${fcard('인프라 예산',`${S.infrastructure}억`,'시설·유스 프로젝트')}${fcard('월간 수익',`${S.monthly}억`,'티켓·상업·운영')}${fcard('이사회 전략',mandate==='youth'?'유스·지역':'승격 가속','월간 평가 기준')}</div><div class="split" style="margin-top:17px"><section class="panel"><div class="head" style="margin-top:0"><h3>예산·티켓 정책</h3><small>숫자 하나가 여러 부서에 영향을 줍니다</small></div><p>운영 자금을 이적 또는 인프라로 전환합니다. 티켓 정책은 단기 수익과 장기 팬 신뢰 사이의 선택이며, 월간 평가 전까지 그 결과가 쌓입니다.</p><div class="actions"><button class="btn gold" data-a="finance" data-v="transfer">운영 자금 8억 → 이적 예산 10억</button><button class="btn light" data-a="finance" data-v="infra">운영 자금 7억 → 인프라 예산 9억</button><button class="btn ${S.ticket==='family'?'gold':'light'}" data-a="finance" data-v="family">지역·가족 우대 티켓</button><button class="btn ${S.ticket==='premium'?'gold':'light'}" data-a="finance" data-v="premium">프리미엄 가격 정책</button></div></section><aside class="detail"><div class="eyebrow">COMMERCIAL DESK</div><h2>스폰서와<br>지역 조항</h2><p>상업 이사는 경기장 콘텐츠와 유니폼 노출을 묶은 지역 메인 스폰서 계약을 제안합니다. 현금은 생기지만 팬과 지역성의 조건도 함께 옵니다.</p><div class="info"><div>계약금<b>13억</b></div><div>월간 수익<b>+2억</b></div><div>팬 조항<b>지역 우선</b></div><div>상태<b>${S.sponsor==='none'?'미계약':'계약 완료'}</b></div></div><div class="actions">${S.sponsor==='none'?'<button class="btn gold" data-a="finance" data-v="sponsor">지역 조항 포함 계약 체결</button>':'<button class="btn light" disabled>지역 메인 스폰서 계약 중</button>'}</div></aside></div><div class="split" style="margin-top:17px"><section class="panel"><div class="head" style="margin-top:0"><h3>팬·언론 데스크</h3><small>이번 주 선택은 다음 주요 일정에서   function calendar(){const l=S.leagueView||S.league,st=standings(l),ev=eventsList();root.innerHTML=shell(`<div class="page-title"><div><div class="eyebrow">SCHEDULE / COMPETITION</div><h2>일정과 리그</h2></div><p>경기, 협상, 재계약, 유스 보고, 공사, 이사회 평가는 같은 달력에서 충돌합니다. 다음 주요 일정은 모든 진행 상태를 한 주 앞으로 보냅니다.</p></div><div class="split"><div><section class="panel"><div class="head" style="margin-top:0"><h3>운영 캘린더</h3><small>${S.season} 시즌 ${S.week}주차</small></div><ul class="news">${ev.map(e=>`<li><time>${e.when}</time><b>${e.title}</b><p>${e.copy}</p></li>`).join('')}</ul></section><section class="panel" style="margin-top:17px"><div class="head" style="margin-top:0"><h3>감독 AI 경기일</h3><small>전술은 감독의 영역</small></div>${matchBox()}<button class="btn gold" style="width:100%;margin-top:12px" data-a="next">다음 주요 일정까지 진행</button></section></div><aside><div class="rule" style="color:var(--ink);background:#f1dfad;padding:13px"><b>승강 규정</b><br>리그1 14위 직접 강등 / 리그2 1위 직접 승격 / 리그1 12위 vs 리그2 2위 / 리그1 13위 vs 리그2 3위 단판 플레이오프</div><div class="tabs" style="margin-top:13px"><button class="${l==='L1'?'active':''}" data-a="league" data-v="L1">개리그1 · 14개</button><button class="${l==='L2'?'active':''}" data-a="league" data-v="L2">개리그2 · 16개</button></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>구단</th><th>전력</th><th>승점</th><th>상태</th></tr></thead><tbody>${st.map(x=>`<tr class="${x.id===S.clubId?'mine':''}"><td>${x.rank}</td><td>${x.name}${x.id===S.clubId?' · 나의 구단':''}</td><td>${x.power}</td><td>${x.points}</td><td>${lstatus(l,x.rank,st.length)}</td></tr>`).join('')}</tbody></table></div></aside></div>`)}

  function familyAction(v){const f=familyState(),person=id=>adultPeople().find(x=>x.id===id);if(v==='propose'){const p=person(document.querySelector('#familyCandidate')?.value);if(!p||relationshipValue(p)<100){news('결혼 제안 보류','호감도 100과 상호 신뢰가 쌓인 성인 가상 인물에게만 결혼을 제안할 수 있습니다.','info')}else if(!p.consent){news('결혼 제안 거절','상대가 현재 업무 관계 유지를 선택했습니다. 거절은 존중되며 같은 날 재시도하지 않습니다.','info')}else{f.status='married';f.spouseId=p.id;f.pendingProposal=null;news('결혼 제안 수락',`${p.name}이(가) 자발적으로 결혼 제안을 수락했습니다. 두 사람의 선택은 다이너스티 가족 기록에 남습니다.`,'gold');socialPost('우리 구단 팬','팬 커뮤니티가 구단주의 결혼 소식에 축하 메시지를 남겼습니다.')}}else if(v==='accept'){const p=person(f.pendingProposal);if(p){f.status='married';f.spouseId=p.id;news('결혼 제안 수락',`${p.name}의 자발적 결혼 제안을 수락했습니다. 가족 기록이 시작됩니다.`,'gold')}f.pendingProposal=null}else if(v==='decline'){const p=person(f.pendingProposal);news('결혼 제안 거절',`${p?.name||'상대'}의 제안을 정중히 거절했습니다. 상대의 선택과 감정은 존중됩니다.`,'info');f.pendingProposal=null}else if(v==='plan-consent'){f.plan={dueWeek:S.week+4};news('가족 계획 동의','두 사람의 자발적 동의로 가족 계획을 기록했습니다. 4주 뒤 가족 소식이 도착합니다.','gold')}else if(v==='plan-decline'){news('가족 계획 보류','가족 계획을 지금은 진행하지 않기로 합의했습니다.','info')}else if(v.startsWith('grow:')){const [,id,kind]=v.split(':'),ch=f.children.find(x=>x.id===id);if(ch){ch.xp+=4;ch.skills[kind]+=5;ch.career=childCareer(ch);news('자녀 성장 지원',`${ch.name}의 ${kind==='sport'?'스포츠':kind==='study'?'학습':kind==='creative'?'창작':'사회성'} 경험치를 지원했습니다. 현재 추천 진로는 ${ch.career}입니다.`,'life')}}save();render()}

  function extraAssistantCall(v){const c=executiveCandidate();if(!c)return;const p=S.personal;let title='',copy='';if(v==='trust'){title='호감도 보고';copy=`현재 전속 비서 호감도는 ${S.executive.interest}/100입니다. 관계 업무 능력 ${c.skills.relation}이 대화·선물 결과에 반영됩니다.`}else if(v==='gift'){S.view='life';p.giftHint='비서가 선물 후보와 전달 일정을 정리했습니다. 대상과 선물을 선택해 주세요.';title='선물 준비 완료';copy=p.giftHint}else if(['stocks','crypto','realty'].includes(v)){const r=recommendation(v);p.investTab=v;p.advice={category:v,name:r.row?.[1]||'추천 없음',chance:r.chance,skill:r.skill,advisor:r.advisor};S.view='life';title=`${v==='stocks'?'주식':v==='crypto'?'가상자산':'부동산'} 추천 완료`;copy=`${r.advisor} 비서의 ${v==='realty'?'운영':'분석'} 능력 ${r.skill}을 반영한 추천 종목은 ${r.row?.[1]}이며, 게임 내 추천 확률은 ${r.chance}%입니다.`}else if(v==='relation'){S.executive.interest=cap(S.executive.interest+Math.max(1,Math.round(c.skills.relation/40)));title='관계 조율 완료';copy=`전속 비서와 업무 경계를 존중하며 관계 대화를 진행했습니다. 호감도 ${S.executive.interest}/100입니다.`}else if(v==='marriage'){S.view='life';title='결혼 상담 완료';copy='호감도 100과 상대의 자발적 동의가 결혼의 전제임을 가족 기록에 안내했습니다.'}else if(v==='family'){S.view='life';title='가족 계획 일정 확인';copy='결혼 후 양측의 동의가 있을 때만 가족 계획을 기록할 수 있습니다.'}else if(v==='clubfans'){socialPost('우리 구단 팬',SOCIAL_TEMPLATES.club[Math.abs(hash(`${S.week}-fan`))%SOCIAL_TEMPLATES.club.length]);title='우리 구단 팬 반응 수집';copy='팬 커뮤니티의 주요 반응을 뉴스 센터에 기록했습니다.'}else if(v==='rivalfans'){socialPost('타구단 팬',SOCIAL_TEMPLATES.rival[Math.abs(hash(`${S.week}-rival`))%SOCIAL_TEMPLATES.rival.length]);title='타구단 팬 반응 수집';copy='상대 구단 커뮤니티의 시선을 뉴스 센터에 기록했습니다.'}else if(v==='rumor'){socialPost('루머 소식',SOCIAL_TEMPLATES.rumor[Math.abs(hash(`${S.week}-rumour`))%SOCIAL_TEMPLATES.rumor.length]);title='루머 진위 점검';copy='확정 전 정보와 이적시장 소문을 분리해 뉴스 센터에 기록했습니다.'}else if(v==='sponsor'){S.board=cap(S.board+Math.max(1,Math.round(c.skills.negotiation/45)));title='스폰서 접점 정리';copy=`협상 능력 ${c.skills.negotiation}을 반영해 상업 파트너 접점을 정리했습니다.`}else if(v==='broadcast'){S.life.station=true;S.life.subscribers+=Math.round(c.skills.med   function mediaAction(a,v){ensureMediaState();const m=S.media,f=familyState();if(a==='owner-transfer'){const amount=Math.floor(Number(document.querySelector('#ownerToClubAmount')?.value)||0);if(amount<=0||S.personal.cash<amount){news('개인 자금 전환 보류','전환 금액과 개인 자산을 확인해 주세요.','bad')}else{S.personal.cash-=amount;S.cash+=amount;S.personal.transferLog.unshift({week:S.week,amount});news('개인 자금 운영자금 전환',`개인 자산 ${amount}억을 구단 운영자금으로 전환했습니다. 개인·구단 장부에 기록되었습니다.`,'finance')}}else if(a==='station-build'){if(S.cash<18||S.infrastructure<6){news('방송국 건물 개설 보류','운영자금 18억과 인프라 예산 6억이 필요합니다.','bad')}else{S.cash-=18;S.infrastructure-=6;m.built=true;S.life.station=true;S.life.subscribers=Math.max(S.life.subscribers,15000);news('캠퍼스 방송국 개설','캠퍼스 안에 콘텐츠·인터뷰·예능·라디오·CF 섭외를 위한 방송국 건물을 개설했습니다.','media');socialPost('우리 구단 팬','팬들이 캠퍼스 방송국 개설 소식에 기대를 보였습니다.')}}else if(a==='station-tab'){m.tab=v}else if(a==='station-accept'){const o=m.offers.find(x=>x.id===v);if(o&&o.state==='대기'){o.state='제작 완료';const guest=stationGuest(o.role);S.cash+=o.fee;S.life.subscribers+=o.fee*550;S.reputation=cap(S.reputation+Math.max(1,Math.round(o.fee/4)));S.fans=cap(S.fans+2);m.contentLog.unshift({week:S.week,copy:`${o.type} · ${o.title} · ${guest} 출연`});news(`방송국 ${o.type} 섭외 수락`,`${guest}의 자발적 출연으로 ${o.title} 제작을 확정했습니다. 구단 수익 ${o.fee}억과 구독자·평판 효과가 반영됩니다.`,'media');socialPost('우리 구단 팬',`${o.title} 출연 소식에 팬들이 기대 메시지를 남겼습니다.`)}}else if(a==='invite'){if(f.status!=='married'){news('청첩장 전달 보류','결혼 기록이 있어야 청첩장을 전달할 수 있습니다.','info')}else if(f.invitations.sent){news('청첩장 안내','이미 청첩장을 전달했습니다. 축하금은 개인 자산 장부에 기록되어 있습니다.','info')}else{const guests=[...S.squad.filter(x=>x.squad!=='youth'),...S.staff,...S.people].filter(x=>x.id!==f.spouseId),gifts=guests.reduce((sum,_,i)=>sum+1+(i%4),0);f.invitations={sent:true,guests:guests.length,gifts};S.personal.cash+=gifts;f.affection=cap(f.affection+6);news('결혼 청첩장·축하금 정산',`선수·감독·스태프·기자 등 ${guests.length}명에게 청첩장을 전달했습니다. 축하금 ${gifts}억이 개인 자산으로 정산되었습니다.`,'gold');socialPost('우리 구단 팬','팬 커뮤니티가   function ensureDynastyState(){if(!S)return;S.reputation=Number.isFinite(S.reputation)?S.reputation:50;S.dynasty={factions:{finance:55,sport:55,youth:55,community:55},emergency:null,emergencyHistory:[],rival:{club:null,tension:42,lastDerby:0},owner:{score:0,title:'현장형 구단주',decisions:0},agents:DYNASTY_AGENTS.map(a=>({...a,trust:45})),youth:{tier:'관찰 세대',focus:'균형 육성',report:'다음 유스 세대 보고를 기다리고 있습니다.',lastWeek:0},crisis:null,tour:null,docu:{active:null,episodes:0,log:[]},legends:[],awards:[],legacy:{points:0,ending:'다이너스티의 첫 장을 쓰는 중입니다.'},...(S.dynasty||{})};const d=S.dynasty;d.factions={finance:55,sport:55,youth:55,community:55,...(d.factions||{})};d.agents=DYNASTY_AGENTS.map(a=>({...a,...(d.agents||[]).find(x=>x.id===a.id)}));d.emergencyHistory=Array.isArray(d.emergencyHistory)?d.emergencyHistory:[];d.legends=Array.isArray(d.legends)?d.legends:[];d.awards=Array.isArray(d.awards)?d.awards:[];d.docu={active:null,episodes:0,log:[],...(d.docu||{})};d.legacy={points:0,ending:'다이너스티의 첫 장을 쓰는 중입니다.',...(d.legacy||{})};if(!d.rival.club)d.rival.club=(activeClubs(S.league).find(x=>x.id!==S.clubId)||{}).name||'라이벌 구단';return d}
  function dynastyTitle(d){const o=d.owner.score;if(o>=42)return'글로벌 다이너스티 설계자';if(o>=28)return'구단 재건의 아이콘';if(o>=15)return'지역을 움직인 구단주';if(o<=-8)return'논쟁의 경영자';return'현장형 구단주'}

  function processDynastyWeek(){const d=ensureDynastyState();if(S.week%3===0)generateDynastyEmergency();if(S.week%6===0&&d.youth.lastWeek!==S.week){const t=['은빛 세대','잠재력 세대','황금세대'][Math.abs(hash(`${S.season}-${S.week}-youth`))%3];d.youth={...d.youth,tier:t,lastWeek:S.week,report:`${t} 유스 보고가 도착했습니다. 육성 우선순위를 선택하면 해당 성향의 유스가 성장합니다.`};dynastyNews('유스 세대 보고',d.youth.report,'youth')}if(d.tour&&d.tour.dueWeek<=S.week){const t=DYNASTY_TOURS.find(x=>x[0]===d.tour.id),gain=t?.[3]||2;S.cash+=gain;S.reputation=cap(S.reputation+gain);S.fans=cap(S.fans+1);d.legacy.points+=gain;dynastyNews('해외 프리시즌 투어 완료',`${t?.[1]||'해외 투어'}가 종료됐습니다. 운영자금 ${gain}억, 평판 +${gain}, 팬 신뢰 +1이 반영됐습니다.`,'gold');d.tour=null}if(d.docu.active&&S.week%2===0){d.docu.episodes++;S.life.subscribers+=850+d.docu.episodes*120;S.reputation=cap(S.reputation+1);d.docu.log.unshift({week:S.week,copy:`${d.docu.active.title} ${d.docu.episodes}화 공개`});dynastyNews('다큐멘터리 시즌 공개',`${d.docu.active.title} ${d.docu.episodes}화가 공개되어 구독자와 구단 평판이 상승했습니다.`,'media')}if(S.week%4===0){const award={week:S.week,title:S.points>=S.week*1.5?'이달의 구단 운영':'이달의 현장 경영',reward:Math.max(2,Math.round((S.fans+S.board)/55))};d.awards.unshift(award);d.awards=d.awards.slice(0,12);S.cash+=award.reward;d.legacy.points+=award.reward;dynastyNews('구단주 월간 시상식',`${award.title}을(를) 수상했습니다. 운영자금 ${award.reward}억과 다이너스티 명예 포인트가 반영됐습니다.`,'gold')}if(S.week%8===0){d.rival.tension=cap(d.rival.tension+6);d.rival.lastDerby=S.week;S.fans=cap(S.fans+2);dynastyNews('라이벌 더비 주간',`${d.rival.club}와의 더비 주간이 시작됐습니다. 팬 기대와 언론의 관심이 높아졌습니다.`,'match')}d.legacy.points+=Math.max(0,Math.round((S.fans+S.board+S.reputation-135)/75));d.legacy.ending=dynastyEnding(d)}

  function faComebackReady(){const score=faComebackScore(),f=ensureFederationState(),c=f.comeback;if(f.status!=='removed')return;if(score<60||f.ethicsRisk>=55){news('재출마 준비 보류',`명예 회복 ${score}/60, 윤리 위험 ${f.ethicsRisk}/55 미만이 필요합니다. 공개 검증과 구단 운영 성과로 신뢰를 더 회복하세요.`,'bad');save();render();return}c.ready=true;c.returns++;f.status='idle';f.ethicsRisk=Math.min(f.ethicsRisk,42);f.fairness=Math.max(f.fairness,58);FA_BLOCKS.forEach(b=>f.blocks[b.id].support=cap(f.blocks[b.id].support+3));f.history.unshift({season:S.season,week:S.week,type:'comeback_ready',score});news('축협회장 재도전 준비 완료',`명예 회복 ${score}점과 공개 검증 기록을 바탕으로 다시 출마할 수 있습니다. 이번 선거에서는 경쟁 후보와 공개 정책 대결을 치르게 됩니다.`,'gold');worldRemember('축협회장 재도전 준비 완료','불신임 이후 구단 운영 성과와 독립 감사 기록으로 다시 출마할 수 있습니다.','gold');save();render()}
  const faVoteTotalBeforeComeback=faVoteTotal;
  faVoteTotal=f=>{const base=faVoteTotalBeforeComeback(f),c=f?.comeback;if(f?.status!=='campaign'||!c?.ready)return base;return clamp(base+Math.floor((Number(c.recovery||0)+Number(c.evidence||0))/45)-Math.floor(Number(c.rivalStrength||64)/58),0,60)};
  const faFederationPanelBeforeComeback=faFederationPanel;
  faFederationPanel=()=>{const f=ensureFederationState(),c=ensureFederationComeback(),cr=ensureFederationCrisis();if(f.status!=='removed')return faFederationPanelBeforeComeback();const score=faComebackScore(),need=Math.max(0,60-score),actions=Object.entries(FA_COMEBACK_ACTIONS).map(([id,a])=>`<button class="btn ${id==='counter'?'gold':'light'}" data-a="fa-comeback" data-v="${id}" ${c.lastActionWeek===S.week?'disabled':''}>${a.label} · ${a.cost}억</button>`).join('');return`<section class="panel" style="margin-top:16px;border-top:3px solid var(--gold)"><div class="eyebrow">NATIONAL FOOTBALL / COMEBACK &amp; PUBLIC REVIEW</div><h3>축협회장 명예 회복·재도전 준비실</h3><p>불신임 이후에도 구단주 커리어는 계속됩니다. 구단 운영 성과, 독립 감사, 공개 대화와 검증 기록으로 신뢰를 회복해 다시 선거에 도전하세요. 근거 없는 공세는 윤리 위험과 역풍으로 돌아옵니다.</p><div class="info"><div>명예 회복<b>${score}/60</b></div><div>감사 자료<b>${c.evidence}/100</b></div><div>경쟁 후보 영향력<b>${c.rivalStrength}/100</b></div><div>윤리 위험<b>${f.ethicsRisk}/55 미만</b></div></div><p class="profile-note" style="margin-top:10px">${c.lastActionWeek===S.week?'이번 주 공개 활동을 마쳤습니다. 다음 주에 다시 활동할 수 있습니다.':`재출마까지 명예 회복 ${need}점이 더 필요합니다.`}</p><div class="actions" style="margin-top:10px">${actions}</div><button class="btn ${score>=60&&f.ethicsRisk<55?'gold':'light'}" data-a="fa-comeback" data-v="ready" style="margin-top:12px" ${score>=60&&f.ethicsRisk<55?'':'disabled'}>재출마 준비 완료 · 공개 선거 복귀</button>${c.history.length?`<ol class="news" style="margin-top:13px">${c.history.slice(0,4).map(x=>`<li><time>${x.week}주차 · ${esc(x.title)}</time><b>${esc(x.result)} · 회복 ${x.score}점</b></li>`).join('')}</ol>`:''}</section>`};
  root.addEventListener('click',e=>{const b=e.target.closest('[data-a="fa-comeback"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.dataset.v==='ready')faComebackReady();else faComebackAction(b.dataset.v)},true);
  const renderBeforeFederationComebackPanel=render;
  render=()=>{renderBeforeFederationComebackPanel();if(S?.stage==='game'&&S.view==='world')setTimeout(()=>{if(S?.stage==='game'&&S.view==='world'){const content=root.querySelector('.content');if(content&&!content.querySelector('.federation-panel'))content.insertAdjacentHTML('beforeend',`<div class="federation-panel">${faFederationPanel()}</div>`);}},0)};
  S=sessionStorage.getItem(ENTRY_GATE_KEY)==='setup'?(loadDraft()||load()||base()):(load()||base());ensureWorldState();ensureFederationState();ensureFederationCrisis();ensureCore();render();
  const OWNER_TUTORIAL_VERSION='2026.08.19-owner-onboarding';
  const OWNER_TUTORIAL_STEPS=[
    {view:'home',title:'취임식이 끝났습니다. 첫 브리핑을 시작합니다.',copy:'새 구단주님, 환영합니다. 감독 AI가 경기 전술을 맡고, 구단주는 자금·인사·선수단·시설·언론의 우선순위를 정합니다. 지금은 비서 브리핑과 받은편지함부터 확인해 주세요.',task:'비서 브리핑과 받은편지함 확인'},
    {view:'finance',title:'예산은 첫 번째 전략입니다',copy:'운영자금·이적 예산·인프라 예산은 서로 다른 미래를 만듭니다. 재정을 열어 연봉 한도와 이사회 신뢰를 함께 확인하세요.',task:'재정 탭에서 예산과 급여 확인'},
    {view:'squad',title:'선수단은 계약과 약속으로 관리합니다',copy:'출전 불만은 재계약 하나로 해결되지 않습니다. 역할 조정과 4주 출전 계획, 임대·이적 허용을 구분해 관리합니다.',task:'선수단에서 역할·출전 상태 확인'},
    {view:'transfers',title:'영입은 관심 등록부터 시작합니다',copy:'모든 후보를 바로 영입할 필요는 없습니다. 능력, 연봉, 이적료, 스폰서 지원을 비교한 뒤 관심 등록·관찰·협상 중 하나를 결정하세요.',task:'이적 시장에서 후보 한 명 비교'},
    {view:'campus',title:'캠퍼스는 장기 성과를 만듭니다',copy:'훈련장·유스·메디컬·스카우트·스타디움은 단순 장식이 아닙니다. 건물을 클릭해 현재 운영 과제와 장기 투자 효과를 확인하세요.',task:'캠퍼스 건물 하나 방문'},
    {view:'calendar',title:'경기 운영은 감독 AI에게 맡깁니다',copy:'감독 AI가 경기 운영을 맡고, 구단주는 경기 전후의 인사·재정·언론 판단을 책임집니다. 일정에서 다음 주요 일정을 확인하세요.',task:'일정 탭에서 다음 주요 일정 확인'},
    {view:'home',title:'한 주의 결과가 왕조를 만듭니다',copy:'마지막으로 다음 주요 일정을 진행하면 경기 결과와 결정의 여파가 선수단·재정·팬·이사회에 기록됩니다. 매주 결과를 확인하고 다음 판단으로 이어가세요.',task:'다음 주요 일정으로 첫 주 진행'}
  ];
  function ensureOwnerTutorial(){
    if(!S)return null;
    S.ownerTutorial={version:OWNER_TUTORIAL_VERSION,active:false,step:0,completed:false,dismissed:false,...(S.ownerTutorial||{})};
    if(S.ownerTutorial.version!==OWNER_TUTORIAL_VERSION){S.ownerTutorial={version:OWNER_TUTORIAL_VERSION,active:false,step:0,completed:false,dismissed:false};}
    S.ownerTutorial.step=Math.max(0,Math.min(OWNER_TUTORIAL_STEPS.length-1,Number(S.ownerTutorial.step)||0));
    return S.ownerTutorial;
  }
  function ownerTutorialOverlay(){
    const t=ensureOwnerTutorial();if(!t?.active||S?.stage!=='game')return '';
    const step=OWNER_TUTORIAL_STEPS[t.step],last=t.step===OWNER_TUTORIAL_STEPS.length-1;
    const checklist=OWNER_TUTORIAL_STEPS.map((x,i)=>`<li class="${i<t.step?'done':i===t.step?'now':''}"><span>${i<t.step?'✓':String(i+1).padStart(2,'0')}</span><b>${x.task}</b></li>`).join('');
    const assistantName=S.executive?.hiredId?S.assistants?.find(x=>x.id===S.executive.hiredId)?.name:'전속 비서';
    return `<section class="owner-tutorial" role="dialog" aria-modal="true" aria-labelledby="ownerTutorialTitle"><article class="owner-tutorial-card"><div class="eyebrow">INAUGURATION BRIEF / ${t.step+1} OF ${OWNER_TUTORIAL_STEPS.length}</div><div class="owner-tutorial-progress"><span style="width:${Math.round((t.step+1)/OWNER_TUTORIAL_STEPS.length*100)}%"></span></div><div class="owner-tutorial-assistant"><span>비서 브리핑</span><b>${assistantName||'전속 비서'}</b><em>“${t.step===0?'취임을 축하드립니다. 첫 주 운영부터 함께 정리하겠습니다.':'다음 운영 판단으로 이동하겠습니다.'}”</em></div><h2 id="ownerTutorialTitle">${step.title}</h2><p>${step.copy}</p><div class="owner-tutorial-task"><b>이번 단계 미션</b><span>${step.task}</span></div><ol>${checklist}</ol><div class="actions"><button class="btn gold" data-a="tutorial-next">${last?'첫 주 운영 시작':'비서 안내 계속 · '+(t.step+2)+'단계'}</button><button class="btn light" data-a="tutorial-skip">안내 건너뛰기</button></div></article></section>`;
  }
  const ownerTutorialStyle=document.createElement('style');
  ownerTutorialStyle.textContent=`.owner-tutorial{position:fixed;inset:0;z-index:95;background:rgba(8,24,20,.76);display:flex;align-items:center;justify-content:center;padding:20px}.owner-tutorial-card{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#f7f4ea;color:#17372f;border-top:4px solid #d7b45a;padding:26px;box-shadow:0 20px 65px rgba(0,0,0,.35)}.owner-tutorial-card h2{margin:10px 0 9px;font-size:27px;color:#13352c}.owner-tutorial-card p{margin:0;color:#51665d;line-height:1.7}.owner-tutorial-progress{height:7px;background:#dfe4dd;margin:14px 0 16px}.owner-tutorial-progress span{display:block;height:100%;background:#c79838}.owner-tutorial-assistant{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:11px 13px;background:#143b32;color:#eff6ef;border-left:3px solid #c79838}.owner-tutorial-assistant span{font-size:10px;color:#d9bc6d;text-transform:uppercase;letter-spacing:.08em}.owner-tutorial-assistant b{font-size:14px}.owner-tutorial-assistant em{grid-column:1/-1;font-size:12px;line-height:1.5;color:#dbe9df;font-style:normal}.owner-tutorial-task{margin:16px 0 11px;padding:12px 13px;background:#e5eee8;border-left:3px solid #c79838}.owner-tutorial-task b,.owner-tutorial-task span{display:block}.owner-tutorial-task b{font-size:11px;color:#687b72;text-transform:uppercase;letter-spacing:.08em}.owner-tutorial-task span{font-size:15px;font-weight:800;margin-top:4px}.owner-tutorial-card ol{list-style:none;margin:0;padding:0;border-top:1px solid #d8ddd6}.owner-tutorial-card li{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #d8ddd6;color:#87948d;font-size:12px}.owner-tutorial-card li span{width:23px;height:23px;display:grid;place-items:center;border:1px solid #bac8bf;color:#6e8076;font-weight:800}.owner-tutorial-card li.now{color:#17372f}.owner-tutorial-card li.now span{border-color:#c79838;background:#c79838;color:#fff}.owner-tutorial-card li.done{color:#2f6a50}.owner-tutorial-card li.done span{border-color:#2f6a50;background:#2f6a50;color:#fff}@media(max-width:720px){.owner-tutorial{align-items:flex-end;padding:10px}.owner-tutorial-card{max-height:calc(100vh - 20px);padding:19px}.owner-tutorial-card h2{font-size:22px}.owner-tutorial-card .actions{display:grid;grid-template-columns:1fr 1fr}.owner-tutorial-card .actions .btn{width:100%;padding:11px 8px;font-size:12px}}`;
  document.head.appendChild(ownerTutorialStyle);
  function mountOwnerTutorial(){
    root.querySelector('.owner-tutorial')?.remove();
    const overlay=ownerTutorialOverlay();if(overlay)root.insertAdjacentHTML('beforeend',overlay);
    const t=ensureOwnerTutorial(),content=root.querySelector('.content');
    if(S?.stage==='game'&&!t.active&&content&&S.view==='home'&&!content.querySelector('.owner-tutorial-replay'))content.insertAdjacentHTML('afterbegin',`<section class="panel owner-tutorial-replay" style="margin-bottom:14px;border-top:3px solid var(--gold)"><div class="eyebrow">FIRST OWNER / OPTIONAL BRIEF</div><h3>취임식 비서 브리핑 다시 보기</h3><p>새 다이너스티에서는 취임식 직후 자동으로 시작됩니다. 현재 커리어에서는 필요할 때만 이 안내를 다시 열 수 있으며, 취임식 영상도 별도로 재생할 수 있습니다.</p><div class="actions"><button class="btn gold" data-a="tutorial-start">첫 주 운영 안내 다시 보기</button><button class="btn light" data-a="cinema" data-v="acquisition">취임식 영상 다시 보기</button></div></section>`);
  }
  const renderBeforeOwnerTutorial=render;

  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a="tutorial-start"],[data-a="tutorial-next"],[data-a="tutorial-skip"]');if(!b||S?.stage!=='game')return;
    e.preventDefault();e.stopImmediatePropagation();const t=ensureOwnerTutorial();
    if(b.dataset.a==='tutorial-start'){t.active=true;t.step=0;t.dismissed=false;localStorage.setItem(UPDATE_NOTICE_KEY,UPDATE_NOTICE_VERSION);root.querySelector('.update-notice')?.remove();}
    if(b.dataset.a==='tutorial-skip'){t.active=false;t.dismissed=true;}
    if(b.dataset.a==='tutorial-next'){if(t.step>=OWNER_TUTORIAL_STEPS.length-1){t.active=false;t.completed=true;t.dismissed=false;S.view='home';news('오너 데뷔 튜토리얼 완료','비서 브리핑, 재정, 선수단, 이적, 캠퍼스, 일정의 첫 운영 흐름을 확인했습니다. 이제 원하는 방향으로 구단의 왕조를 운영하세요.','gold');}else{t.step++;S.view=OWNER_TUTORIAL_STEPS[t.step].view;}}
    save();render();
  },true);
  const startCareerBeforeCeremonyTutorial=startCareer;
  startCareer=()=>{
    startCareerBeforeCeremonyTutorial();
    if(S?.stage==='game'){
      const t=ensureOwnerTutorial();
      t.active=true;t.step=0;t.completed=false;t.dismissed=false;
      S.view='home';
      S.cinematic=null;
      root.querySelector('.update-notice')?.remove();
      news('취임식 비서 브리핑 시작','취임식 영상은 자동으로 열지 않고 보관했습니다. 먼저 비서 안내를 따라 예산·선수단·이적·캠퍼스·일정을 확인하세요. 영상은 홈 화면에서 언제든 다시 볼 수 있습니다.','gold');
      save();render();
    }
  };
  render();
})();
